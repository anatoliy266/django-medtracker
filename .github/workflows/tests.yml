name: Django CI Tests

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: medicine_db
          POSTGRES_USER: medicine_user
          POSTGRES_PASSWORD: strong_password_123
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U medicine_user -d medicine_db"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.14
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Django tests
        working-directory: ./medtracker
        env:
          SECRET_KEY: ci-test-secret-key
          DEBUG: 'False'
          POSTGRES_DB: medicine_db
          POSTGRES_USER: medicine_user
          POSTGRES_PASSWORD: strong_password_123
          POSTGRES_HOST: localhost
          POSTGRES_PORT: '5432'
          REDIS_URL: redis://localhost:6379/1
        run: |
          python manage.py test -v 2